# Phase 15: Database Webhook calls this function with a shared secret header.
# JWT verification is disabled at the gateway because this is a server-to-server
# webhook. The function rejects requests unless x-pulsechat-webhook-secret
# exactly matches the PUSH_WEBHOOK_SECRET Edge Function secret.
[functions.send-message-push]
verify_jwt = false

# Phase 18: the function performs its own bearer-token validation before any
# destructive operation, matching the Phase 15 manual-auth pattern.
[functions.delete-account]
verify_jwt = false

# Phase 26: a scheduled server-to-server worker verifies Expo delivery receipts.
# The function rejects requests unless x-pulsechat-receipt-secret matches the
# separately configured PUSH_RECEIPT_SECRET.
[functions.poll-push-receipts]
verify_jwt = false

# Phase 27.3: this function validates the bearer token with Supabase Auth and
# performs its authorization query through the user's RLS-bound client. Gateway
# verification stays disabled for publishable-key compatibility; unauthenticated
# requests never reach token signing.
[functions.issue-call-token]
verify_jwt = false
